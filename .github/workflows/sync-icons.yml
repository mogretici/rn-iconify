name: Sync Icons

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Icon names are this package's public API, so what the sync changes has
      # to be visible on the pull request rather than buried in a diff of
      # thousands of generated lines.
      - name: Record current icon names
        run: npx tsx scripts/report-icon-changes.ts snapshot .icon-inventory.json

      - name: Generate icon components
        run: npm run generate-components

      - name: Summarise icon changes
        id: icons
        run: |
          # Written to a file first: the script appends `breaking=` to
          # $GITHUB_OUTPUT itself, and interleaving that with the heredoc below
          # would corrupt both values.
          npx tsx scripts/report-icon-changes.ts report .icon-inventory.json > icon-changes.md
          {
            echo 'summary<<ICON_SUMMARY'
            cat icon-changes.md
            echo 'ICON_SUMMARY'
          } >> "$GITHUB_OUTPUT"
          cat icon-changes.md >> "$GITHUB_STEP_SUMMARY"
          rm -f .icon-inventory.json icon-changes.md

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The pull request this job opens is created with GITHUB_TOKEN, and
      # GitHub does not start workflows for those — so CI never sees it. Every
      # check that would have run on the pull request has to run here instead.
      #
      # size-limit is the one that mattered: a sync that added 6,363 alias
      # entries doubled what every application installs, and nothing looked.
      - name: Check bundle size (size-limit)
        run: npx size-limit

      - name: Validate package.json (publint)
        run: npx publint

      - name: Validate TypeScript exports (attw)
        run: npx @arethetypeswrong/cli --pack . --ignore-rules cjs-only-exports-default

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/components/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Icon changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No icon changes"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # A removed name breaks anyone using it, so the commit has to say so
          # — semantic-release reads this to decide major vs minor.
          commit-message: |
            ${{ steps.icons.outputs.breaking == 'true'
                && 'feat!: sync icon sets with Iconify API'
                || 'feat: sync icon sets with Iconify API' }}

            ${{ steps.icons.outputs.breaking == 'true'
                && 'BREAKING CHANGE: icon names were removed upstream and could not be aliased.'
                || 'Adds icons published upstream since the last sync.' }}
          title: |
            ${{ steps.icons.outputs.breaking == 'true'
                && 'feat!: sync icon sets with Iconify API' 
                || 'feat: sync icon sets with Iconify API' }}
          body: |
            Updates the generated icon components from the Iconify API.

            ${{ steps.icons.outputs.summary }}

            Renamed icons keep their old name as an alias, so a rename upstream
            does not remove anything here. A removal in the table above means
            the icon is gone upstream entirely — check before merging.

            Auto-generated by the weekly sync workflow.
          branch: sync-icons
          delete-branch: true
