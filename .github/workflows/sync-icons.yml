name: Sync Icons

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # semantic-release runs in this job, and needs the tags to know what the
      # last version was.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Icon names are this package's public API, and this sync publishes
      # without anyone reading it. What it changes has to be written into the
      # release rather than buried in a diff of thousands of generated lines.
      - name: Record current icon names
        run: npx tsx scripts/report-icon-changes.ts snapshot .icon-inventory.json

      - name: Generate icon components
        run: npm run generate-components

      - name: Summarise icon changes
        id: icons
        run: |
          # `report` writes `breaking=` to $GITHUB_OUTPUT itself, so it runs on
          # its own; `notes` is the longer text the release carries.
          npx tsx scripts/report-icon-changes.ts report .icon-inventory.json \
            >> "$GITHUB_STEP_SUMMARY"
          npx tsx scripts/report-icon-changes.ts notes .icon-inventory.json \
            > .icon-notes.txt
          rm -f .icon-inventory.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Everything a pull request would have checked runs here, because there
      # is no pull request. size-limit is the one that earned its place: a sync
      # that kept 6,363 renamed names as map entries doubled what every
      # application installs, and nothing was looking.
      - name: Check bundle size (size-limit)
        run: npx size-limit

      - name: Validate package.json (publint)
        run: npx publint

      - name: Validate TypeScript exports (attw)
        run: npx @arethetypeswrong/cli --pack . --ignore-rules cjs-only-exports-default

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain src/components/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Icon changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No icon changes"
          fi

      # Published without review, including when a name is removed.
      #
      # A removal is a breaking change and is released as one: the commit says
      # `feat!` with a BREAKING CHANGE footer, semantic-release cuts a major,
      # and the notes name every icon that left. Nobody is upgraded against
      # their will by that — a major is opt-in, and the person deciding has the
      # list in front of them. Holding it for someone to press merge would not
      # have made the removal safer, only later, and staying current would have
      # depended on somebody remembering.
      - name: Publish
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BREAKING: ${{ steps.icons.outputs.breaking }}
        run: |
          set -euo pipefail

          if [ "$BREAKING" = "true" ]; then
            subject='feat!: sync icon sets with Iconify API'
            footer='BREAKING CHANGE: names were removed upstream and could not be kept as aliases. They are listed above.'
          else
            subject='feat: sync icon sets with Iconify API'
            footer=''
          fi

          {
            echo "$subject"
            echo
            cat .icon-notes.txt
            if [ -n "$footer" ]; then
              echo
              echo "$footer"
            fi
          } > .commit-message.txt
          rm -f .icon-notes.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components
          git commit --file .commit-message.txt
          rm -f .commit-message.txt
          git push

          # That push carries GITHUB_TOKEN, and GitHub does not start workflows
          # for those — the Release workflow will never see it. The release has
          # to happen here or not at all.
          npx semantic-release
