name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    name: Build & Validate Package
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # A bundler resolving lib/module/index.js reads the manifest next to it,
      # not the one at the root. Without sideEffects there, importing one icon
      # set keeps all 226.
      - name: Verify ESM manifest is tree-shakeable
        run: |
          node -e "
            const m = require('./lib/module/package.json');
            if (m.type !== 'module' || m.sideEffects !== false) {
              console.error('lib/module/package.json is', JSON.stringify(m));
              process.exit(1);
            }
          "

      - name: Validate package.json (publint)
        run: npx publint

      # The one remaining exception is deliberate: the Babel plugin entry has a
      # default export because that is the interface Babel loads a plugin
      # through, exactly as every @babel/plugin-* package does. Everything else
      # resolves cleanly under node10, node16 and bundler.
      - name: Validate TypeScript exports (attw)
        run: npx @arethetypeswrong/cli --pack . --ignore-rules cjs-only-exports-default

      - name: Check bundle size (size-limit)
        run: npx size-limit

      - name: Check package size
        run: |
          npm pack --dry-run 2>&1
          SIZE=$(npm pack --dry-run 2>&1 | tail -1)
          echo "📦 Package: $SIZE"

  compat:
    name: Node.js Compatibility
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
