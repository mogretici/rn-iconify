name: Native

# Compiling the native module takes a macOS runner, which bills at ten times
# the rate of Linux. Nothing about that build changes unless the native
# sources, the podspec, the example app or the package manifest change, so it
# runs when they do rather than on every documentation typo.
#
# The two lists below are identical and have to be written twice: GitHub
# Actions does not resolve YAML anchors.
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android/**'
      - 'RNIconify.podspec'
      - 'example/**'
      - 'package.json'
      - 'src/native/**'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android/**'
      - 'RNIconify.podspec'
      - 'example/**'
      - 'package.json'
      - 'src/native/**'
      - '.github/workflows/native.yml'

jobs:
  # The native module is compiled the way an application compiles it:
  # autolinked into the example app, through codegen, against React Native's
  # own headers. Parsing the sources was the previous guarantee and it could
  # not have caught a wrong header, a missing symbol or a broken podspec —
  # only a typo.
  android:
    name: Android build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      # The example's Babel config loads the plugin from lib/.
      - name: Build package
        run: npm run build

      - name: Install example dependencies
        run: npm install --prefix example --no-audit --no-fund

      # The example's iOS project is committed; its Android one is generated,
      # which is also what proves the config plugin story still holds.
      - name: Generate the Android project
        working-directory: example
        run: npx expo prebuild -p android

      - name: Build the example app
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

  ios:
    name: iOS build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install example dependencies
        run: npm install --prefix example --no-audit --no-fund

      - name: Install pods
        working-directory: example/ios
        run: pod install

      - name: Build the example app
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace rniconifyexample.xcworkspace \
            -scheme rniconifyexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

